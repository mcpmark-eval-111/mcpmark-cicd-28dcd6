name: Deployment Status Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      prev_sha: ${{ steps.git-info.outputs.prev_sha }}
      current_sha: ${{ steps.git-info.outputs.current_sha }}
      package_version: ${{ steps.git-info.outputs.package_version }}
      issue_number: ${{ steps.create-issue.outputs.result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Capture Git Info
        id: git-info
        run: |
          CURRENT_SHA="${{ github.sha }}"
          PREV_SHA="${{ github.event.before }}"
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT_SHA")
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "prev_sha=$PREV_SHA" >> $GITHUB_OUTPUT
          echo "package_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Deployment Tracking Issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const currentSha = '${{ steps.git-info.outputs.current_sha }}';
            
            // Ensure labels exist
            for (const label of ['deployment', 'in-progress', 'completed']) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'deployment' ? '0052cc' : label === 'in-progress' ? 'fef2c0' : '0e8a16'
                });
              } catch (e) {
                // Label may already exist
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${currentSha}`,
              labels: ['deployment', 'in-progress'],
              body: `Deployment tracking issue for commit ${currentSha}.
Previous Commit: \`${{ steps.git-info.outputs.prev_sha }}\`
Package Version: \`${{ steps.git-info.outputs.package_version }}\``
            });
            
            return issue.data.number;

      - name: Post Pre-deployment Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create-issue.outputs.result }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Pre-deployment checks completed'
            });

  rollback-preparation:
    name: rollback-preparation
    needs: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Rollback Components
        run: |
          python3 -c "
          import os, shutil
          os.makedirs('rollback-artifacts/backups', exist_ok=True)
          
          # 1. Rollback script
          with open('rollback-artifacts/rollback.sh', 'w') as f:
              f.write('''#!/bin/bash
          set -e
          echo \"=== Starting Rollback Process ===\"
          
          # Error handling trap
          trap 'echo \"Error: Rollback failed at line \$LINENO\" >&2' ERR
          
          if [ ! -d \"backups\" ]; then
            echo \"Error: Backup directory not found!\" >&2
            exit 1
          fi
          
          echo \"Restoring configurations...\"
          cp backups/package.json .
          cp backups/package-lock.json .
          if [ -f \"backups/.env.template\" ]; then
            cp backups/.env.template .env
          fi
          
          echo \"Verifying restored configurations...\"
          if [ ! -f \"package.json\" ]; then
            echo \"Error: package.json restoration failed!\" >&2
            exit 1
          fi
          
          echo \"Running dependency verification...\"
          ./verify-dependencies.sh
          
          echo \"=== Rollback Successfully Completed ===\"
          ''')
          
          # 2. Backups
          shutil.copy('package.json', 'rollback-artifacts/backups/package.json')
          shutil.copy('package-lock.json', 'rollback-artifacts/backups/package-lock.json')
          with open('rollback-artifacts/backups/.env.template', 'w') as f:
              f.write('PORT=3000
')
              
          # 3. Verify dependencies script
          with open('rollback-artifacts/verify-dependencies.sh', 'w') as f:
              f.write('''#!/bin/bash
          set -e
          echo \"=== Verifying Dependencies ===\"
          
          trap 'echo \"Error: Dependency verification failed\" >&2' ERR
          
          echo \"Checking Node.js version...\"
          node --version
          
          echo \"Checking npm version...\"
          npm --version
          
          echo \"Installing dependencies via npm ci...\"
          npm ci
          
          echo \"Dependency verification successful!\"
          ''')
          
          # 4. ROLLBACK.md
          with open('rollback-artifacts/ROLLBACK.md', 'w') as f:
              f.write('''# Rollback Procedure Documentation
          
          This package contains files needed to rollback deployment for commit \`{current_sha}\`.
          
          ## Step-by-Step Instructions
          
          1. Extract the rollback package:
             \`\`\`bash
             tar -xzf rollback-package.tar.gz
             \`\`\`
          2. Run the rollback script:
             \`\`\`bash
             ./rollback.sh
             \`\`\`
          3. Confirm configuration was restored (package.json and .env).
          4. Confirm application can start correctly.
          '''.format(current_sha='${{ needs.pre-deployment.outputs.current_sha }}'))
          "
          chmod +x rollback-artifacts/rollback.sh
          chmod +x rollback-artifacts/verify-dependencies.sh

      - name: Compress Rollback Package
        run: |
          cd rollback-artifacts
          tar -czf rollback-package.tar.gz rollback.sh verify-dependencies.sh ROLLBACK.md backups/
          sha256sum rollback-package.tar.gz > checksum.sha256
          cd ..

      - name: Generate and Set Checksum Output
        id: checksum
        run: |
          HASH=$(sha256sum rollback-artifacts/rollback-package.tar.gz | awk '{print $1}')
          echo "checksum=$HASH" >> $GITHUB_OUTPUT

      - name: Upload Rollback Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          path: rollback-artifacts/
          retention-days: 30

      - name: Post Rollback Plan ready comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}');
            const prevSha = '${{ needs.pre-deployment.outputs.prev_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const checksum = '${{ steps.checksum.outputs.checksum }}';
            
            const commentBody = `### 🔄 Rollback Plan Ready

` +
              `Previous Commit: ${prevSha}
` +
              `Current Commit: ${currentSha}
` +
              `Package Version: ${packageVersion}
` +
              `Artifact: rollback-package-${currentSha}

` +
              `### Completed Rollback Components
` +
              `* ✅ Executable rollback script created
` +
              `* ✅ Configuration backups created
` +
              `* ✅ Dependency verification script created
` +
              `* ✅ Detailed rollback documentation created
` +
              `* ✅ Compressed rollback package with SHA256 checksum generated

` +
              `### Quick Rollback Command
` +
              `\x60\x60\x60bash
` +
              `# Extract and run rollback
` +
              `tar -xzf rollback-package.tar.gz && ./rollback.sh
` +
              `\x60\x60\x60

` +
              `Rollback script created: true
` +
              `Configuration backup: true
` +
              `SHA256: ${checksum}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

  post-deployment:
    name: post-deployment
    needs: [pre-deployment, rollback-preparation]
    runs-on: ubuntu-latest
    steps:
      - name: Update Labels and Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}');
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const checksum = '${{ needs.rollback-preparation.outputs.checksum }}';
            
            // Remove 'in-progress' label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (e) {
              // Label may not exist
            }
            
            // Add 'completed' label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            
            // Post completion comment
            const completionComment = `### Deployment Completed Successfully

` +
              `All pre-deployment and rollback checks passed successfully.

` +
              `**Rollback Artifact Details:**
` +
              `- **Artifact Name:** rollback-package-${currentSha}
` +
              `- **SHA256 Checksum:** \`${checksum}\`
` +
              `- **Retention Period:** 30 Days`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: completionComment
            });
            
            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
